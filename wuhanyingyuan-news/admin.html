<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">

  <title>后台管理｜盈圆新闻资讯</title>

  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/news.css">
</head>
<body class="admin-body">
  <!-- 登录视图 -->
  <div id="loginView" hidden>
    <div class="admin-login">
      <h1>新闻资讯后台</h1>
      <p>请输入管理密码登录</p>
      <form id="loginForm">
        <div class="form-item">
          <label for="loginPassword">管理密码</label>
          <input type="password" id="loginPassword" autocomplete="current-password" required>
        </div>
        <div class="form-actions" style="margin-top:18px;">
          <button class="btn" type="submit" id="loginBtn">登 录</button>
        </div>
        <p class="form-hint" id="loginError" style="margin-top:12px;color:#b91c1c;display:none;">密码错误，请重试</p>
      </form>
    </div>
  </div>

  <!-- 管理视图 -->
  <div id="adminView" hidden>
    <header class="admin-header">
      <div class="container">
        <strong>盈圆 · 新闻资讯后台</strong>
        <div class="admin-header-actions">
          <a href="index.html" target="_blank" rel="noopener">查看网站</a>
          <button class="btn-mini" id="logoutBtn" type="button">退出登录</button>
        </div>
      </div>
    </header>

    <main class="admin-main">
      <div class="container">
        <!-- 文章列表 -->
        <section class="admin-panel" id="listPanel">
          <div class="admin-panel-head">
            <h2>文章管理</h2>
            <button class="btn-mini primary" id="newBtn" type="button">+ 新建文章</button>
          </div>
          <div style="overflow-x:auto;">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>标题</th>
                  <th class="hide-sm">分类</th>
                  <th class="hide-sm">创建时间</th>
                  <th>状态</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="articleRows">
                <tr><td colspan="5">正在加载…</td></tr>
              </tbody>
            </table>
          </div>
        </section>

        <!-- 编辑器 -->
        <section class="admin-panel" id="editorPanel" hidden>
          <div class="admin-panel-head">
            <h2 id="editorTitle">新建文章</h2>
          </div>

          <form class="form-grid" id="articleForm">
            <div class="form-item">
              <label for="fieldTitle">文章标题 *</label>
              <input type="text" id="fieldTitle" required maxlength="100" placeholder="例如：巨量引擎本地推最新政策解读">
            </div>

            <div class="form-row">
              <div class="form-item">
                <label for="fieldCategory">分类</label>
                <input type="text" id="fieldCategory" maxlength="20" placeholder="例如：行业动态 / 投放干货 / 平台政策">
              </div>
              <div class="form-item">
                <label for="fieldSummary">摘要（列表页展示）</label>
                <input type="text" id="fieldSummary" maxlength="120" placeholder="一句话概括文章内容">
              </div>
            </div>

            <div class="form-item">
              <label>封面图（可选）</label>
              <div class="cover-upload">
                <img id="coverPreview" hidden alt="封面预览">
                <input type="text" id="fieldCover" placeholder="图片地址，或点击右侧上传" style="flex:1;">
                <input type="file" id="coverFile" accept="image/*" hidden>
                <button class="btn-mini" type="button" id="coverUploadBtn">上传图片</button>
                <button class="btn-mini danger" type="button" id="coverClearBtn">清除</button>
              </div>
              <p class="form-hint">支持 jpg / png / webp，建议 16:9 比例，5MB 以内</p>
            </div>

            <div class="form-item">
              <label for="fieldContent">正文内容 *（支持 HTML 标签）</label>
              <textarea id="fieldContent" placeholder="支持 HTML 标签，例如：&#10;<h2>小标题</h2>&#10;<p>正文段落…</p>&#10;<img src='图片地址'>&#10;<ul><li>列表项</li></ul>"></textarea>
              <p class="form-hint">常用标签：&lt;h2&gt; 标题、&lt;p&gt; 段落、&lt;img src=""&gt; 图片、&lt;strong&gt; 加粗、&lt;ul&gt;&lt;li&gt; 列表</p>
            </div>

            <div class="form-actions">
              <label class="check"><input type="checkbox" id="fieldPublished" checked> 立即发布</label>
              <button class="btn" type="submit" id="saveBtn">保存</button>
              <button class="btn ghost" type="button" id="cancelBtn">取消</button>
            </div>
          </form>
        </section>
      </div>
    </main>
  </div>

  <div class="admin-toast" id="toast" role="status"></div>

  <script src="js/admin.js" defer></script>
</body>
</html>
