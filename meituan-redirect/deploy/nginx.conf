# 美团联盟中转页 - Nginx 配置（子域名版，与公司官网共存）
# 域名：mt.wuhanyingyuan.com（官网 www.wuhanyingyuan.com 不受任何影响）
# 原理：Nginx 按 server_name 区分站点，两个域名共用 80/443 端口，互不干扰
# 安装：放到 /etc/nginx/conf.d/meituan-jump.conf，然后 nginx -t && nginx -s reload

# HTTP -> HTTPS 跳转（只对 mt 子域名生效，不会影响官网的 80 流量）
server {
    listen 80;
    server_name mt.wuhanyingyuan.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mt.wuhanyingyuan.com;

    # certbot 申请后路径一般是这个（以 certbot 实际输出为准）
    ssl_certificate     /etc/letsencrypt/live/mt.wuhanyingyuan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mt.wuhanyingyuan.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/meituan-jump.access.log;
    error_log  /var/log/nginx/meituan-jump.error.log;

    client_max_body_size 1m;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }
}
