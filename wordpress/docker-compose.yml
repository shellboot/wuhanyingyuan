name: wuhanyingyuan

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: mariadb:11.4.13
    logging: *default-logging
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - backend

  wordpress:
    logging: *default-logging
    build:
      context: .
      dockerfile: docker/wordpress/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: wp_
      SITE_URL: ${SITE_URL}
      WP_ENVIRONMENT_TYPE: ${WP_ENVIRONMENT_TYPE:-production}
      WP_DEBUG: ${WP_DEBUG:-false}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', getenv('SITE_URL'));
        define('WP_SITEURL', getenv('SITE_URL'));
        define('WP_ENVIRONMENT_TYPE', getenv('WP_ENVIRONMENT_TYPE') ?: 'production');
        define('WP_DEBUG', filter_var(getenv('WP_DEBUG'), FILTER_VALIDATE_BOOLEAN));
        define('WP_DEBUG_LOG', false);
        define('WP_DEBUG_DISPLAY', false);
        define('DISALLOW_FILE_EDIT', true);
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('FS_METHOD', 'direct');
    volumes:
      - wordpress_data:/var/www/html
      - uploads_data:/var/www/html/wp-content/uploads
      - ./wp-content/themes/wuhanyingyuan:/var/www/html/wp-content/themes/wuhanyingyuan:ro
      - ./wp-content/plugins/wuhanyingyuan-core:/var/www/html/wp-content/plugins/wuhanyingyuan-core:ro
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\",9000); exit($$s ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - backend

  nginx:
    image: nginx:1.30.6-alpine
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      - ./docker/nginx/php-fpm.conf:/etc/nginx/snippets/php-fpm.conf:ro
      - wordpress_data:/var/www/html:ro
      - uploads_data:/var/www/html/wp-content/uploads:ro
      - ./wp-content/themes/wuhanyingyuan:/var/www/html/wp-content/themes/wuhanyingyuan:ro
      - ./wp-content/plugins/wuhanyingyuan-core:/var/www/html/wp-content/plugins/wuhanyingyuan-core:ro
      - certbot_www:/var/www/certbot:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - backend

  wpcli:
    image: wordpress:cli-2.12.0-php8.3
    logging: *default-logging
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: wp_
    volumes:
      - wordpress_data:/var/www/html
      - uploads_data:/var/www/html/wp-content/uploads
      - ./wp-content/themes/wuhanyingyuan:/var/www/html/wp-content/themes/wuhanyingyuan:ro
      - ./wp-content/plugins/wuhanyingyuan-core:/var/www/html/wp-content/plugins/wuhanyingyuan-core:ro
      - ./tests:/var/www/html/tests:ro
    working_dir: /var/www/html
    networks:
      - backend

networks:
  backend:
    internal: false

volumes:
  db_data:
  wordpress_data:
  uploads_data:
  certbot_www:
