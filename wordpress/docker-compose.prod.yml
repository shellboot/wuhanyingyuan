services:
  db:
    restart: unless-stopped

  wordpress:
    restart: unless-stopped

  nginx:
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./docker/nginx/tls.generated.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:v5.8.0
    profiles: ["tools"]
    entrypoint: certbot
    volumes:
      - ./certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - backend

volumes:
  certbot_www:
